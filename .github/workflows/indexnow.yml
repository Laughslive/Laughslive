name: Notify search engines (IndexNow)
on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Send page list to IndexNow (Bing, Yandex, Seznam, Naver…)
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          key = "ffb2c0a04a20e46c005ce948422542e3"
          urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read())
          body = json.dumps({"host": "laughslive.com", "key": key,
                             "keyLocation": f"https://laughslive.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow response:", r.status, "for", len(urls), "pages")
          PY
